server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
spring:
  application:
   name: MessengerProject
  datasource:
    driverClassName: org.postgresql.Driver
    url: ${SPRING_DATA_SOURCE_URL:jdbc:postgresql://localhost:5432/messenger_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:123}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  sql:
    init:
      mode: always
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  mail:
    host: ${mail.transport.protocol}.gmail.com
    port: ${MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /messenger-project/swagger-ui.html
minio:
  url: ${MINIO_URL:}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
mail:
  smtp:
    auth: true
    starttls:
      enable: true
  transport:
    protocol: smtp
  debug: true

jwt:
  secret: ${JWT_SECRET_KEY}
  access:
    expiration: 900000 # 15 minutes
  refresh:
    expiration: 604800000 # 7 days
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.web: DEBUG
    org.springframework.security.authentication: DEBUG
    org.springframework.security.access: DEBUG